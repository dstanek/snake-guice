[project]
name = "snake-guice"
version = "1.0.0a1"
description = "A simple, lightweight Python dependency injection framework"
authors = [
    {name = "David Stanek", email = "dstanek@dstanek.com"},
]
license = "MIT"
readme = "README.rst"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = []

[project.urls]
Repository = "https://github.com/dstanek/snake-guice"
Documentation = "https://snake-guice.readthedocs.io/"

[project.optional-dependencies]
docs = [
    "Sphinx>=5.3.0",
    "reno>=3.5.0",
    "myst-parser>=0.18.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "flake8>=7.3.0",
    "black==26.5.1",
    "isort==8.0.1",
    "Routes>=2.5.1",
    "WebOb>=1.8.10",
    "mypy>=2.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["snakeguice"]

[tool.black]
verbose = true
line-length = 88
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile="black"
skip_gitignore = true

[tool.mypy]
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
