[project]
name = "snake-guice"
version = "1.0.0a1"
description = "A simple, lightweight Python dependency injection framework"
authors = [
    {name = "David Stanek", email = "dstanek@dstanek.com"},
]
license = "MIT"
readme = "README.rst"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = []

[project.urls]
Repository = "https://github.com/dstanek/snake-guice"
Documentation = "https://snake-guice.readthedocs.io/"

[project.optional-dependencies]
docs = [
    "Sphinx>=5.3.0",
    "myst-parser>=0.18.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "ruff>=0.11.0",
    "Routes>=2.5.1",
    "WebOb>=1.8.10",
    "mypy>=2.1.0",
    "fastapi>=0.137.0",
    "sqlalchemy>=2.0.50",
    "httpx>=0.28.1",
    "uvicorn>=0.49.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["snakeguice"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "examples.wsgiapp.forms",
    "examples.cherrypy.controllers",
    "examples.cherrypy.scopes",
    "examples.shared.template_engines.mako_engine",
]
disallow_subclassing_any = false
disallow_untyped_decorators = false
warn_return_any = false

[[tool.mypy.overrides]]
module = [
    "examples.fastapi_tasks.fastapi_native.deps",
    "examples.fastapi_tasks.fastapi_snakeguice.deps",
    "examples.fastapi_tasks.fastapi_snakeguice.scopes",
]
warn_return_any = false
